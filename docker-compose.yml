

services:
  server:
    build:
      context: ./server
    container_name: bikeledger-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      CLIENT_URL: http://localhost:5173
    restart: unless-stopped

  client:
    build:
      context: ./client
    container_name: bikeledger-client
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped
