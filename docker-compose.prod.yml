services:
  server:
    image: shanumukh/bikeledger-backend:${IMAGE_TAG:-latest}
    container_name: bikeledger-docker-server

    env_file:
      - .env

    environment:
      PORT: 5000
      CLIENT_URL: http://15.134.65.78:8080

    expose:
      - "5000"

    restart: unless-stopped

    networks:
      - bikeledger-network

  client:
    image: shanumukh/bikeledger-frontend:${IMAGE_TAG:-latest}
    container_name: bikeledger-docker-client

    ports:
      - "8080:80"

    depends_on:
      - server

    restart: unless-stopped

    networks:
      - bikeledger-network

networks:
  bikeledger-network:
    driver: bridge
